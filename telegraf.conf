[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 20000
  flush_interval = "10s"
  omit_hostname = true

# Topic: unab/capstone/<tipo>/<dispositivo>/telemetria
# Payload: {"var1": 1.0, "var2": 2.0, ..., "ts": <ms unix>}
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  username = "ingesta"
  password = "${MQTT_INGESTA_PASS}"
  topics = ["unab/capstone/+/+/telemetria"]
  qos = 1
  persistent_session = true
  client_id = "telegraf-capstone"
  connection_timeout = "30s"
  data_format = "json_v2"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "unab/capstone/+/+/telemetria"
    tags = "_/_/tipo/dispositivo/_"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "capstone"
    timestamp_path = "ts"
    timestamp_format = "unix_ms"
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "@this"
      excluded_keys = ["ts"]
      disable_prepend_keys = true

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"
